<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Network Failure Detection</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <h1>Network Failure Detection</h1>

  <div id="banner" class="banner ok">Loading...</div>

  <div id="counters">
    <div class="counter up"><b id="c-up">0</b> UP</div>
    <div class="counter degraded"><b id="c-degraded">0</b> DEGRADED</div>
    <div class="counter down"><b id="c-down">0</b> DOWN</div>
    <div class="counter unreachable"><b id="c-unreachable">0</b> UNREACHABLE</div>
  </div>

  <div id="main">
    <svg id="map" viewBox="0 0 800 400"></svg>
    <div id="details"><h3>Device details</h3><p>Click a device on the map.</p></div>
  </div>

  <h3>Event log</h3>
  <ul id="log"></ul>

  <script src="app.js"></script>
</body>
</html>
